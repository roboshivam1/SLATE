{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Debug — extracted misconceptions</h1>
  
</section>

{% for c in concepts %}
<section class="panel">
  <h2>{{ c.name }}</h2>
  <p class="muted">{{ c.summary }}</p>
  <ul class="misclist">
    {% for m in by_concept.get(c.id, []) %}
      <li>
        <strong>{{ m.name }}</strong><br>
        <span class="wrong">“{{ m.wrong_model }}”</span><br>
        <span class="right">{{ m.correct_model }}</span>
      </li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
{% endblock %}
