{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>{{ doc.title }}</h1>
  <h2>Your concept map</h2>
  <div class="conceptmap">
    {% for c in concept_map %}
      <div class="node m-{{ c.mastery }}">
        {{ c.name }}
        <span class="mastery">{{ c.mastery }}</span>
      </div>
    {% endfor %}
  </div>
</section>

<section class="panel" id="question-area">
  {% if concept %}
    {% include "partials/question.html" %}
  {% else %}
    <p class="muted">No concepts yet.</p>
  {% endif %}
</section>
{% endblock %}
