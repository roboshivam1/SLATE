<h2>{{ concept.name }}</h2>
<p class="question">{{ question }}</p>

<form hx-post="/answer" hx-target="#question-area" hx-swap="innerHTML">
  <input type="hidden" name="concept_id" value="{{ concept.id }}">
  <input type="hidden" name="question_text" value="{{ question }}">
  <textarea name="answer_text" rows="5" required
            placeholder="Explain in your own words — 2 to 4 sentences."></textarea>
  <div class="formrow">
    <button type="submit">Submit</button>
    <span class="htmx-indicator muted">thinking…</span>
  </div>
</form>
